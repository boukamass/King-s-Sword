<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="ks-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <linearGradient id="blade-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4f4f5" />
      <stop offset="100%" stop-color="#a1a1aa" />
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  
  <!-- Outer Badge / Shield -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="#09090b" stroke="#0d9488" stroke-width="3" stroke-opacity="0.6"/>
  
  <!-- Background Glow -->
  <circle cx="64" cy="64" r="38" fill="url(#ks-grad)" opacity="0.15" />
  
  <!-- Open Book Pages -->
  <path d="M 28 84 Q 48 76 64 80 Q 80 76 100 84 L 98 48 Q 80 42 64 46 Q 48 42 30 48 Z" fill="#18181b" stroke="#3f3f46" stroke-width="2" />
  <path d="M 32 82 Q 48 75 64 78 Q 80 75 96 82 L 94 51 Q 80 45 64 49 Q 48 45 34 51 Z" fill="#27272a" opacity="0.8" />
  <line x1="64" y1="46" x2="64" y2="80" stroke="#0d9488" stroke-width="2" stroke-linecap="round" opacity="0.8" />

  <!-- Sword (Vertical Center) -->
  <!-- Blade -->
  <path d="M 62 20 L 64 12 L 66 20 L 66 70 L 62 70 Z" fill="url(#blade-grad)" stroke="#ffffff" stroke-width="0.75" />
  <!-- Blade Ridge -->
  <line x1="64" y1="14" x2="64" y2="70" stroke="#71717a" stroke-width="0.8" />
  <!-- Crossguard -->
  <rect x="48" y="70" width="32" height="5" rx="2.5" fill="url(#gold-grad)" stroke="#b45309" stroke-width="0.5" />
  <circle cx="50" cy="72.5" r="2" fill="#fef3c7" />
  <circle cx="78" cy="72.5" r="2" fill="#fef3c7" />
  <!-- Hilt/Handle -->
  <rect x="62" y="75" width="4" height="14" rx="1.5" fill="#713f12" stroke="#451a03" stroke-width="0.5" />
  <!-- Pommel / Crown -->
  <circle cx="64" cy="92" r="4.5" fill="url(#gold-grad)" stroke="#b45309" stroke-width="0.5" />
  <circle cx="64" cy="92" r="2" fill="#fef3c7" />

  <!-- Radiance / Stars -->
  <circle cx="64" cy="12" r="1.5" fill="#38bdf8" />
  <circle cx="34" cy="30" r="1" fill="#2dd4bf" opacity="0.6" />
  <circle cx="94" cy="30" r="1" fill="#2dd4bf" opacity="0.6" />
</svg>
