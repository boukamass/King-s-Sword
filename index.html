
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#09090b">
  <title>King's Sword - Étude de Sermons</title>
  <script>
    (function() {
      try {
        window.global = window;
      } catch (e) {}

      if (typeof window.process === 'undefined') {
        window.process = {
          env: { NODE_ENV: 'production' },
          browser: true,
          version: '',
          nextTick: function(fn) { setTimeout(fn, 0); }
        };
      }

      // Safe fetch handler to prevent "Cannot set property fetch of #<Window> which has only a getter"
      try {
        var nativeFetch = typeof window.fetch === 'function' ? window.fetch.bind(window) : undefined;
        var activeFetch = nativeFetch;
        var fetchDescriptor = Object.getOwnPropertyDescriptor(window, 'fetch') || Object.getOwnPropertyDescriptor(Window.prototype, 'fetch');
        
        if (!fetchDescriptor || !fetchDescriptor.set || !fetchDescriptor.writable) {
          var getFetch = function() {
            return activeFetch || (typeof window.fetch === 'function' && window.fetch !== getFetch ? window.fetch : nativeFetch);
          };
          var setFetch = function(val) {
            activeFetch = val;
          };

          try {
            Object.defineProperty(window, 'fetch', {
              configurable: true,
              enumerable: true,
              get: getFetch,
              set: setFetch
            });
          } catch (errWindow) {
            try {
              Object.defineProperty(Window.prototype, 'fetch', {
                configurable: true,
                enumerable: true,
                get: getFetch,
                set: setFetch
              });
            } catch (errProto) {}
          }
        }
      } catch (e) {}
    })();
  </script>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">

  <link rel="stylesheet" href="/fonts/fonts.css">
  <script>
    if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('/sw.js').catch(function() {});
      });
    }
  </script>
  <style>
    html, body {
      font-family: 'Plus Jakarta Sans', Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      background-color: #f8fafc;
      color: #09090b;
    }
    html.dark, body.dark {
      background-color: #09090b;
      color: #f4f4f5;
    }
    html.is-projection, body.is-projection {
      background-color: #000000 !important;
      overflow: hidden !important;
    }
  </style>
  <script>
    if ((window.location.search.indexOf('projection=true') !== -1 || window.location.search.indexOf('mask=true') !== -1) && (window.name === 'KingsSwordProjection' || window.name === 'KingsSwordMask' || window.opener)) {
      document.documentElement.classList.add('is-projection');
      document.documentElement.style.backgroundColor = '#000000';
    }
  </script>
